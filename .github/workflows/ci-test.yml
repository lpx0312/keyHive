name: ci-test

# 测试防线：vet + 全量后端测试（Linux 跑 -race）+ 前端 vitest
# 说明：本仓库既有的 release/docker 流水线仍保持 tag/手动触发不变；
# 本流水线随 push(main)/PR 触发，若不需要可删除或改 paths 过滤。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx vitest run
        working-directory: web
